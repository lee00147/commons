[package]
name = "commons"
version = "0.1.0"
description = "Commons phase 1: CMN on Solana (monetary rule, compute market, useful-work mining, banks, Store)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "commons"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1", features = ["init-if-needed"] }
anchor-spl = { version = "1.1", features = ["token_2022", "token_2022_extensions"] }
commons-econ = { path = "../../crates/commons-econ" }
solana-sha256-hasher = "3.1"
